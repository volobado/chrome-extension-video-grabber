<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="popup.css" />
  <title>Video Grabber</title>
</head>
<body>
  <header>
    <div class="logo">🎬 Video Grabber</div>
    <div class="head-btns">
      <button id="dashboard" class="icon-btn" data-i18n-title="dashOpenTitle">📊</button>
      <button id="detach" class="icon-btn" data-i18n-title="detachTitle">🗗</button>
      <button id="refresh" class="icon-btn" data-i18n-title="refresh">⟳</button>
    </div>
  </header>

  <!-- Куда сохраняем -->
  <div class="dirbar">
    <span class="dir-label" data-i18n="saveTo"></span>
    <span id="dirPath" class="dir-path" title="">…</span>
    <button id="pickDir" class="link-btn" data-i18n="change"></button>
    <button id="typeDir" class="link-btn" data-i18n-title="typePathTitle">✎</button>
    <button id="openDir" class="link-btn" data-i18n-title="openDirTitle">📂</button>
  </div>
  <div id="dirEditRow" class="dir-edit" hidden>
    <input id="dirInput" type="text" class="dir-input" spellcheck="false" />
    <button id="dirSave" class="btn small" data-i18n="save"></button>
  </div>

  <!-- Блок 1: лучшее качество через yt-dlp (YouTube и др.) -->
  <section class="best">
    <div class="best-title" data-i18n="bestTitle"></div>
    <div class="best-sub" id="pageHost">…</div>
    <div class="dub-row" id="dubRow" hidden>
      <span data-i18n="dubLabel"></span>
      <select id="dubSelect" class="sel dub-sel" data-i18n-title="dubTitle"></select>
    </div>
    <div class="best-row">
      <button id="ytdlpBest" class="btn primary">⬇ <span data-i18n="btnBest"></span></button>
      <select id="ytdlpFormat" class="sel" data-i18n-title="qualityTitle">
        <option value="best" data-i18n="qMax"></option>
        <option value="1080" data-i18n="q1080"></option>
        <option value="720" data-i18n="q720"></option>
        <option value="480" data-i18n="q480"></option>
        <option value="audio" data-i18n="qAudio"></option>
      </select>
    </div>
    <button id="ytdlpPlaylist" class="btn wide" hidden>🗂 <span data-i18n="btnPlaylist"></span></button>
    <div id="ytdlpStatus" class="status"></div>
  </section>

  <!-- Блок 2: очередь загрузок -->
  <section class="queue">
    <div class="direct-head">
      <span data-i18n="queueTitle"></span>
      <span>
        <button id="dashboardLink" class="link-btn" data-i18n="dashOpen"></button>
        <button id="cancelAll" class="link-btn" data-i18n="cancelAll"></button>
        <button id="clearDone" class="link-btn" data-i18n="clearDone"></button>
      </span>
    </div>
    <div class="queue-ctl">
      <button id="pauseAll" class="btn ctl" data-i18n="pauseAll"></button>
      <button id="resumeAll" class="btn ctl" data-i18n="resumeAll"></button>
    </div>
    <ul id="queueList" class="list"></ul>
    <div id="queueEmpty" class="empty" data-i18n="queueEmpty"></div>
  </section>

  <!-- Блок 3: прямые медиа со страницы -->
  <section class="direct">
    <div class="direct-head">
      <span data-i18n="foundOnPage"></span>
      <button id="clear" class="link-btn" data-i18n="clear" data-i18n-title="clearTitle"></button>
    </div>
    <ul id="mediaList" class="list"></ul>
    <div id="empty" class="empty" data-i18n="emptyHint"></div>
  </section>

  <footer>
    <span id="hostState" class="host-state" data-i18n="hostChecking"></span>
  </footer>

  <script src="host.js"></script>
  <script src="popup.js"></script>
</body>
</html>
